[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-forecast-agent"
version = "0.1.0"
description = "Urban traffic forecasting, congestion analysis, dashboard, and rule-based agent demo."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
traffic-agent = "traffic_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["outputs", "data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
