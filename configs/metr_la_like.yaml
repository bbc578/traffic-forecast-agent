# Template for real PeMS/METR-LA/PEMS-BAY style data.
# You must prepare the dataset yourself as a local .npz file.
# The file must use the same schema as data/sample/synthetic_traffic.npz:
#   data: [T, N, F]
#   adjacency: [N, N]
#   feature_names: includes "speed" and optionally "flow"
#   node_ids: [N]
# This repository does not include large real traffic datasets.
seed: 42
data:
  path: data/real/metr_la_like.npz
  input_steps: 12
  horizon: 12
  train_ratio: 0.7
  val_ratio: 0.1
  target_feature: speed
training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
analysis:
  congestion_speed_threshold: 35.0
  top_k: 10
outputs:
  dir: outputs
  run_name: metr_la_like_run
  allow_overwrite: false
