name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate synthetic demo data
        run: python -m traffic_agent.data.generate_synthetic --output data/sample/synthetic_traffic.npz
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
